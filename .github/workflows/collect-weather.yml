name: Collect weather data

on:
  workflow_dispatch:
  schedule:
    # 9 AM and 3 PM Philippine Time on Wednesday and Friday (UTC = PHT - 8 hours)
    - cron: "0 1,7 * * 3,5"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch weather data
        run: python scripts/collect_weather.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update weather data"
          git push
